<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<title>SirenFinder — Earth Siren Map</title>
<meta name="description" content="A unified worldwide map of outdoor warning sirens imported from community-maintained siren maps.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<style>
:root{color-scheme:dark;--bg:#071018;--panel:#0d1923;--panel2:#12222e;--line:#263946;--text:#edf6f8;--muted:#9db0ba;--accent:#f0b429;--blue:#27a7d8;--good:#3ac47d;--bad:#ff6b6b;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text)}body{overflow:hidden}button,input,select{font:inherit}.shell{height:100%;display:flex;flex-direction:column}.topbar{height:68px;flex:none;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;background:rgba(7,16,24,.98);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px}.mark{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;background:var(--accent);color:#14202a;font-weight:900}.brand h1{margin:0;font-size:20px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;text-align:right}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(39,167,216,.14)}.dot.ready{background:var(--good);box-shadow:0 0 0 4px rgba(58,196,125,.14)}.dot.error{background:var(--bad);box-shadow:0 0 0 4px rgba(255,107,107,.14)}.workspace{min-height:0;flex:1;display:grid;grid-template-columns:350px 1fr}.sidebar{min-height:0;overflow:auto;padding:18px;background:var(--panel);border-right:1px solid var(--line)}label{display:block;margin:0 0 7px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.search{display:flex;margin-bottom:14px}.search input{border-radius:10px 0 0 10px}.search button{width:44px;border:1px solid var(--line);border-left:0;border-radius:0 10px 10px 0;background:var(--panel2);color:var(--muted);font-size:22px}input,select{width:100%;padding:11px 12px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(39,167,216,.16)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.metric{padding:10px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-width:0}.metric strong,.metric span{display:block}.metric strong{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric span{margin-top:2px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}button{cursor:pointer}.actions button,.primary{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text)}.actions .primary{background:var(--accent);border-color:var(--accent);color:#13202a;font-weight:800}.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 9px}.section-head h2{margin:0;font-size:14px}.section-head span{color:var(--muted);font-size:12px}.results{display:grid;gap:7px}.result{width:100%;padding:10px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text)}.result:hover{border-color:#496473}.result strong,.result small{display:block}.result strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result small{margin-top:4px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:18px 10px;color:var(--muted);text-align:center}.credits{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.5}.credits a{color:#70c7e8}.map-panel{position:relative;min-width:0;min-height:0}.map{position:absolute;inset:0}.overlay{position:absolute;z-index:3;left:50%;top:20px;transform:translateX(-50%);width:min(440px,calc(100% - 30px));padding:17px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(13,25,35,.94);box-shadow:0 18px 45px rgba(0,0,0,.28);backdrop-filter:blur(10px);text-align:center}.overlay h2{margin:2px 0 7px;font-size:17px}.overlay p{margin:0;color:var(--muted);line-height:1.45}.spinner{width:30px;height:30px;margin:0 auto 10px;border:3px solid rgba(255,255,255,.14);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}.hidden{display:none!important}.mobile-panel{display:none;position:absolute;z-index:4;left:12px;top:12px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text)}.maplibregl-popup-content{background:var(--panel)!important;color:var(--text);border:1px solid var(--line);border-radius:12px!important}.maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}.popup-title{margin:0 0 4px;font-size:15px}.popup-meta{color:var(--muted);font-size:12px}.popup-desc{margin-top:8px;max-height:130px;overflow:auto;font-size:12px;line-height:1.4}.popup-link{display:inline-block;margin-top:9px;color:#71c9eb}.build-note{margin:12px 0 0;padding:10px;border:1px solid #564b2b;border-radius:10px;background:#2b2719;color:#e9dca8;font-size:12px;line-height:1.4}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.topbar{height:62px;padding:8px 12px}.brand p{display:none}.workspace{display:block}.sidebar{position:absolute;z-index:6;top:62px;bottom:0;left:0;width:min(360px,91vw);transform:translateX(-103%);transition:transform .2s ease;box-shadow:16px 0 35px rgba(0,0,0,.35)}.sidebar.open{transform:none}.map-panel{position:absolute;inset:62px 0 0}.mobile-panel{display:block}.status{max-width:45%;font-size:11px}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><div class="mark">SF</div><div><h1>SirenFinder</h1><p>Every exportable community siren map, combined</p></div></div><div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Loading Earth map…</span></div></header>
<main class="workspace">
<aside id="sidebar" class="sidebar">
<label for="search">Find a siren</label><div class="search"><input id="search" type="search" placeholder="Name, model, city, or source…" autocomplete="off"><button id="clear" type="button" aria-label="Clear search">×</button></div>
<label for="sourceFilter">Source map</label><select id="sourceFilter"><option value="">All source maps</option></select>
<div class="metrics"><div class="metric"><strong id="pinCount">—</strong><span>sirens</span></div><div class="metric"><strong id="sourceCount">—</strong><span>sources</span></div><div class="metric"><strong id="updatedAt">—</strong><span>updated</span></div></div>
<div class="actions"><button id="fit" class="primary" type="button">Fit results</button><button id="reset" type="button">Earth view</button></div>
<div id="buildNote" class="build-note hidden"></div>
<section><div class="section-head"><h2>Results</h2><span id="resultCount">0</span></div><div id="results" class="results"></div></section>
<footer class="credits">Pins remain credited to the original community map creators. <a href="https://www.airraidsirens.net/forums/viewtopic.php?t=27945" target="_blank" rel="noreferrer">Master map directory</a>.</footer>
</aside>
<section class="map-panel"><button id="mobilePanel" class="mobile-panel" type="button">Search & filters</button><div id="map" class="map" aria-label="Interactive worldwide siren map"></div><div id="loading" class="overlay"><div class="spinner"></div><h2>Loading SirenFinder</h2><p id="loadingText">Downloading the merged worldwide pin database…</p></div><div id="fatal" class="overlay hidden"><h2>Map data is not ready</h2><p id="fatalText"></p><button class="primary" style="margin-top:12px" onclick="location.reload()">Retry</button></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat().format(n||0),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const state={map:null,data:{type:'FeatureCollection',features:[]},filtered:[],query:'',source:''};
function status(t,m=''){ $('#statusText').textContent=t;$('#statusDot').className='dot '+m }
function mapInit(){if(!window.maplibregl)throw Error('The map library was blocked by the network.');state.map=new maplibregl.Map({container:'map',center:[-20,25],zoom:1.45,minZoom:1,maxZoom:20,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]}});state.map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');}
function sourcesOf(f){const p=f.properties||{};return p.sources||[p.source].filter(Boolean)}function match(f){const p=f.properties||{};if(state.source&&!sourcesOf(f).includes(state.source))return false;if(!state.query)return true;return `${p.name||''} ${p.description||''} ${p.layer||''} ${sourcesOf(f).join(' ')}`.toLowerCase().includes(state.query.toLowerCase())}
function sourceFilter(){const counts=new Map;state.data.features.forEach(f=>sourcesOf(f).forEach(s=>counts.set(s,(counts.get(s)||0)+1)));const sel=$('#sourceFilter'),cur=sel.value;sel.innerHTML='<option value="">All source maps</option>';[...counts].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([n,c])=>{const o=document.createElement('option');o.value=n;o.textContent=`${n} (${fmt(c)})`;sel.append(o)});if([...sel.options].some(o=>o.value===cur))sel.value=cur;$('#sourceCount').textContent=fmt(counts.size)}
function popup(f){const p=f.properties||{},src=sourcesOf(f).slice(0,5).join(' · '),desc=p.description?`<div class="popup-desc">${esc(p.description)}</div>`:'',url=(p.sourceUrls||[p.sourceUrl]).filter(Boolean)[0],link=url?`<a class="popup-link" href="${esc(url)}" target="_blank" rel="noreferrer">Original source map</a>`:'';new maplibregl.Popup({maxWidth:'350px'}).setLngLat(f.geometry.coordinates).setHTML(`<h3 class="popup-title">${esc(p.name||'Unnamed siren')}</h3><div class="popup-meta">${esc(src)}</div>${desc}${link}`).addTo(state.map)}
function results(fs){const box=$('#results');box.replaceChildren();const list=(state.query||state.source?fs:fs.slice(0,80)).slice(0,200);if(!list.length){box.innerHTML='<div class="empty">No sirens match.</div>';return}const frag=document.createDocumentFragment();list.forEach(f=>{const p=f.properties||{},b=document.createElement('button');b.className='result';b.innerHTML=`<strong>${esc(p.name||'Unnamed siren')}</strong><small>${esc(sourcesOf(f).slice(0,3).join(' · '))}</small>`;b.onclick=()=>{state.map.flyTo({center:f.geometry.coordinates,zoom:15});popup(f);if(matchMedia('(max-width:760px)').matches)$('#sidebar').classList.remove('open')};frag.append(b)});box.append(frag)}
function apply(fit=false){state.filtered=state.data.features.filter(match);state.map.getSource('sirens')?.setData({type:'FeatureCollection',features:state.filtered});results(state.filtered);$('#resultCount').textContent=fmt(state.filtered.length);if(fit)fitMap(state.filtered)}function fitMap(fs){if(!fs.length)return;if(fs.length===1)return state.map.flyTo({center:fs[0].geometry.coordinates,zoom:15});const b=new maplibregl.LngLatBounds;fs.forEach(f=>b.extend(f.geometry.coordinates));state.map.fitBounds(b,{padding:55,maxZoom:13})}
function layers(){state.map.addSource('sirens',{type:'geojson',data:state.data,cluster:true,clusterMaxZoom:14,clusterRadius:52});state.map.addLayer({id:'clusters',type:'circle',source:'sirens',filter:['has','point_count'],paint:{'circle-color':['step',['get','point_count'],'#278fbd',100,'#1678a8',1000,'#0d5f8d'],'circle-radius':['step',['get','point_count'],17,100,22,1000,28],'circle-stroke-width':2,'circle-stroke-color':'#fff'}});state.map.addLayer({id:'cluster-count',type:'symbol',source:'sirens',filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-size':12},paint:{'text-color':'#fff'}});state.map.addLayer({id:'pins',type:'circle',source:'sirens',filter:['!',['has','point_count']],paint:{'circle-color':'#f0b429','circle-radius':['interpolate',['linear'],['zoom'],3,3.5,10,5.5,16,7],'circle-stroke-width':1.5,'circle-stroke-color':'#fff'}});state.map.on('click','clusters',async e=>{const f=state.map.queryRenderedFeatures(e.point,{layers:['clusters']})[0];if(!f)return;const z=await state.map.getSource('sirens').getClusterExpansionZoom(f.properties.cluster_id);state.map.easeTo({center:f.geometry.coordinates,zoom:z})});state.map.on('click','pins',e=>e.features?.[0]&&popup(e.features[0]));['clusters','pins'].forEach(l=>{state.map.on('mouseenter',l,()=>state.map.getCanvas().style.cursor='pointer');state.map.on('mouseleave',l,()=>state.map.getCanvas().style.cursor='')})}
async function json(path){const r=await fetch(`${path}?v=${Date.now()}`,{cache:'no-store'}),d=await r.json().catch(()=>null);if(!r.ok||!d)throw Error(`${r.status} ${r.statusText}`);return d}
async function start(){try{mapInit();const [data,st]=await Promise.all([json('./data/pins.geojson'),json('./data/status.json').catch(()=>null)]);if(data.type!=='FeatureCollection'||!Array.isArray(data.features))throw Error('The pin database is invalid.');if(!data.features.length)throw Error(st?.message||'The initial worldwide data import is still running. Reload in a few minutes.');state.data=data;$('#pinCount').textContent=fmt(data.features.length);const updated=st?.updatedAt||data.metadata?.updatedAt;$('#updatedAt').textContent=updated?new Date(updated).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'—';sourceFilter();results(data.features);$('#resultCount').textContent=fmt(data.features.length);if(st&&st.directorySourceTotal){const n=$('#buildNote');n.classList.remove('hidden');n.textContent=`Imported ${st.directorySourceCount}/${st.directorySourceTotal} master-list maps; ${st.failedSourceCount||0} unavailable or export-disabled.`}await new Promise(r=>state.map.loaded()?r():state.map.once('load',r));layers();$('#loading').classList.add('hidden');status(`${fmt(data.features.length)} sirens loaded`,'ready')}catch(e){console.error(e);$('#loading').classList.add('hidden');$('#fatal').classList.remove('hidden');$('#fatalText').textContent=e.message;status('Data not ready','error')}}
let timer;$('#search').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{state.query=e.target.value.trim();apply()},130)};$('#clear').onclick=()=>{$('#search').value='';state.query='';apply()};$('#sourceFilter').onchange=e=>{state.source=e.target.value;apply(Boolean(state.source))};$('#fit').onclick=()=>fitMap(state.filtered.length?state.filtered:state.data.features);$('#reset').onclick=()=>state.map.easeTo({center:[-20,25],zoom:1.45});$('#mobilePanel').onclick=()=>$('#sidebar').classList.toggle('open');start()})();
</script>
</body></html>
