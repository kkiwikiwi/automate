name: Import SirenFinder Registry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-sirenfinder-registry.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/sirenfinder-registry-trigger-*'

permissions:
  contents: write

concurrency:
  group: sirenfinder-registry-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sirenfinder
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import every currently resolved master-list map
        run: python scripts/import_registry_maps.py
      - name: Split international and U.S. data for fast startup
        run: python scripts/split_data.py
      - name: Commit imported data to SirenFinder website branch
        run: |
          git config user.name "SirenFinder Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pins.geojson data/pins-world.geojson data/pins-us.geojson data/manifest.json data/status.json data/source-registry.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Import resolved SirenFinder registry maps [skip ci]"
            git push origin HEAD:sirenfinder
          fi
