name: Build SirenFinder Worldwide Data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-sirenfinder-data.yml
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write

concurrency:
  group: sirenfinder-worldwide-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sirenfinder
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download worldwide siren maps and merge metadata
        run: python scripts/build_data.py
      - name: Split international and U.S. data for fast startup
        run: python scripts/split_data.py
      - name: Commit SirenFinder data to website branch
        run: |
          git config user.name "SirenFinder Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pins.geojson data/pins-world.geojson data/pins-us.geojson data/manifest.json data/status.json data/source-registry.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update international SirenFinder data [skip ci]"
            git push origin HEAD:sirenfinder
          fi
