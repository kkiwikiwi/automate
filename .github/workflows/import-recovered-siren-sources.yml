name: Import Recovered SirenFinder Sources

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/sirenfinder-recovered-batch-trigger-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sirenfinder-recovered-batch
  cancel-in-progress: true

jobs:
  apply-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sirenfinder
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge reviewed recovered source links into the registry
        run: python scripts/apply_recovered_source_batch.py
      - name: Import all registered source maps
        run: python scripts/import_registry_maps.py
      - name: Rebuild fast regional chunks and 82-entry source audit
        run: |
          python scripts/split_data.py
          python scripts/build_master_coverage.py
      - name: Commit recovered sources and generated data
        run: |
          git config user.name "SirenFinder Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/source-registry.json data/recovered-source-batch.json data/pins.geojson data/pins-world.geojson data/pins-us.geojson data/manifest.json data/status.json data/master-coverage.json
          if git diff --cached --quiet; then
            echo "No recovered-source changes"
          else
            git commit -m "Import recovered SirenFinder source batch [skip ci]"
            git push origin HEAD:sirenfinder
          fi
