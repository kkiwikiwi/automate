name: Build SirenFinder Earth Map
on:
  push:
    branches: [sirenfinder]
    paths:
      - scripts/**
      - data/source-registry.json
      - .github/workflows/sirenfinder.yml
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: write
concurrency:
  group: sirenfinder-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sirenfinder
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download worldwide siren datasets and merge metadata
        run: python scripts/build_data.py
      - name: Commit the prepared worldwide pin database
        run: |
          git config user.name "SirenFinder Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pins.geojson data/status.json data/source-registry.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update worldwide siren data [skip ci]"
            git push origin HEAD:sirenfinder
          fi
