name: Refresh SirenFinder data

on:
  workflow_dispatch:
  push:
    branches: [sirenfinder]
    paths:
      - 'scripts/**'
      - 'data/source-registry.json'
      - '.github/workflows/refresh-sirenfinder.yml'
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: write

concurrency:
  group: sirenfinder-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sirenfinder
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and merge source maps
        run: python scripts/build_data.py
      - name: Split database for fast loading
        run: python scripts/split_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "SirenFinder Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pins.geojson data/pins-world.geojson data/pins-us.geojson data/manifest.json data/status.json data/source-registry.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh SirenFinder data [skip ci]"
            git push origin HEAD:sirenfinder
          fi
